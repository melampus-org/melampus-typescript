name: Publish npm package
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing validated release tag (for example v0.1.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: publish-npm
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate tag input
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Verify release provenance
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          git merge-base --is-ancestor HEAD origin/main
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run ci
      - run: npm pack --ignore-scripts --pack-destination dist
      - name: Publish using npm trusted publishing
        run: npm publish dist/*.tgz --access public --provenance --tag alpha
