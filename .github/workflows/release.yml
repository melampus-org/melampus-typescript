name: Release
on:
  push:
    branches: [main]
    paths: [VERSION, CHANGELOG.md]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run ci
      - run: npm run demo
      - run: npm run demo:registration
      - run: npm run demo:pilot
      - run: npm pack --ignore-scripts --pack-destination dist
      - name: Tag and release validated artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs
