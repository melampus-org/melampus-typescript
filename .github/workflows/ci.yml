name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "22.18.0"
          - os: ubuntu-latest
            node: "24"
          - os: ubuntu-latest
            node: "26"
          - os: macos-latest
            node: "24"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run ci
      - run: npm run demo
      - run: npm run demo:registration
      - run: npm run demo:pilot
  interoperability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Capture actual JavaScript OTel protobuf
        run: node scripts/export-interop.mjs "$RUNNER_TEMP/melampus-wire"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: melampus-org/melampus-python
          ref: 9518b44dfb580305832f6499ff5fead98a6c1ee6
          path: .reference-python
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.17"
          python-version: "3.11"
      - name: Validate using pinned Python decoder
        run: uv run --project .reference-python --locked --extra watch python scripts/check-python-interop.py "$RUNNER_TEMP/melampus-wire"
